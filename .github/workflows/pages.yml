name: Publish GitHub Pages
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    # Activate the hourly sync by setting DRIVE_SYNC_ENABLED=true after configuring the secret.
    if: github.event_name != 'schedule' || vars.DRIVE_SYNC_ENABLED == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test tests/catalog.test.mjs
      - name: Build library
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          DRIVE_SYNC_ENABLED: ${{ vars.DRIVE_SYNC_ENABLED }}
        run: |
          if [ "$DRIVE_SYNC_ENABLED" = "true" ]; then
            python scripts/sync_drive.py
          else
            echo '::notice::Google connection pending. Publishing initial empty library.'
            python scripts/sync_drive.py --bootstrap-empty
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
